name: Windows portable release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows-portable:
    name: Build Windows portable executable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run desktop:package -- --no-bundle --ci

      - name: Stage release asset
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/retos-desktop.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected portable executable was not produced: $exePath"
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $exePath "release/Retos-portable.exe"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Automated build ${{ github.sha }}
          body: Automated Windows portable executable and Android ARM64 APK build from main at commit ${{ github.sha }}.
          prerelease: true
          files: release/Retos-portable.exe
          overwrite_files: true
