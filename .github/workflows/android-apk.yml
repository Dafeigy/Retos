name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable ARM64 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: android --no-metrics sdk install "platforms/android-37.0" "build-tools/36.0.0" "ndk/30.0.16248370"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run android:init

      - name: Build installable APK
        run: npm run android:build:debug

      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail

          outputs_dir="src-tauri/gen/android/app/build/outputs"
          echo "Generated Android build outputs:"
          find "$outputs_dir" -type f -print | sort

          mapfile -t apk_files < <(find "$outputs_dir/apk" -type f -name '*.apk' -print | sort)
          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK, found ${#apk_files[@]}." >&2
            printf 'APK candidate: %s\n' "${apk_files[@]}" >&2
            exit 1
          fi

          apk_path="${apk_files[0]}"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [[ ! -x "$apksigner" ]]; then
            echo "apksigner is missing or not executable: $apksigner" >&2
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name 'apksigner*' -print >&2
            exit 1
          fi

          mkdir -p release
          cp "$apk_path" release/Retos-android-arm64-debug.apk
          "$apksigner" verify --verbose --print-certs release/Retos-android-arm64-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Retos-android-arm64-debug
          path: release/Retos-android-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
