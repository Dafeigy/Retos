name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build signed ARM64 release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: android --no-metrics sdk install "platforms/android-37.0" "build-tools/36.0.0" "ndk/30.0.16248370"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run android:init

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEY_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $secret_name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/retos-release.jks"
          node scripts/configure-android-signing.mjs

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/retos-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build

      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail

          outputs_dir="src-tauri/gen/android/app/build/outputs"
          echo "Generated Android build outputs:"
          find "$outputs_dir" -type f -print | sort

          mapfile -t apk_files < <(find "$outputs_dir/apk" -type f -name '*.apk' -print | sort)
          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK, found ${#apk_files[@]}." >&2
            printf 'APK candidate: %s\n' "${apk_files[@]}" >&2
            exit 1
          fi

          apk_path="${apk_files[0]}"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [[ ! -x "$apksigner" ]]; then
            echo "apksigner is missing or not executable: $apksigner" >&2
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name 'apksigner*' -print >&2
            exit 1
          fi

          mkdir -p release
          cp "$apk_path" release/Retos-android-arm64-release.apk
          "$apksigner" verify --verbose --print-certs release/Retos-android-arm64-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Retos-android-arm64-release
          path: release/Retos-android-arm64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Automated build ${{ github.sha }}
          body: Automated Windows portable executable and Android ARM64 APK build from main at commit ${{ github.sha }}.
          prerelease: true
          files: release/Retos-android-arm64-release.apk
          overwrite_files: true
